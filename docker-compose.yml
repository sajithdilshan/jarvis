services:
  # --- Temporal ---
  temporal:
    image: temporalio/auto-setup:latest
    ports:
      - "4004:7233"   # gRPC (worker connects here)
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgres
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:latest
    ports:
      - "4001:8080"   # http://localhost:4001
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal

  # --- PostgreSQL + pgvector (shared: Temporal backend + Jarvis memory) ---
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    ports:
      - "4003:5432"
    volumes:
      # HOST bind-mount — survives Docker Desktop VM resets. NOT a named volume.
      - ~/.jarvis/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- pgweb: browse/query the jarvis DB in the browser (local dev only) ---
  pgweb:
    image: sosedoff/pgweb:latest
    ports:
      - "4002:8081"   # http://localhost:4002
    environment:
      - PGWEB_DATABASE_URL=postgres://temporal:temporal@postgres:5432/jarvis?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  # --- Jarvis Application ---
  jarvis:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:4000"   # http://localhost:4000
    environment:
      - JARVIS_PORT=4000
      - TEMPORAL_HOST=temporal:7233
      - POSTGRES_DSN=postgresql://temporal:temporal@postgres:5432/jarvis
      - JARVIS_MCP_CONFIG=/app/mcp/servers.yaml
      - JARVIS_UI_STATIC_DIR=/app/web/dist
      # Embedding model is cached at ~/.jarvis/data/models (mounted below). Load it
      # straight from disk — skip the HuggingFace Hub revalidation calls on startup.
      - HF_HUB_OFFLINE=1
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # AWS Bedrock — region defaults to eu-central-1 in code; set AWS_REGION to override.
      # Do NOT put AWS_PROFILE in .env: the container has no ~/.aws/config, so boto3 must
      # use the static creds below. Keep AWS_PROFILE in your host shell (e.g. .zshrc) only.
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
    env_file:
      - .env
    volumes:
      - ./config:/app/config
      - ./mcp:/app/mcp
      - ~/.jarvis/auth:/app/auth:ro
      - ~/.jarvis/data/models:/root/.cache/huggingface   # cache embedding model
      - ~/.gmail-mcp:/root/.gmail-mcp                     # Gmail MCP OAuth creds + token
      - ~/.google-calendar-mcp:/root/.google-calendar-mcp           # Google Calendar MCP OAuth client
      - ~/.config/google-calendar-mcp:/root/.config/google-calendar-mcp  # Google Calendar MCP tokens
      - ~/.jarvis/data/slack-mcp:/root/.cache/slack-mcp-server  # Slack channel/user cache
      - ~/.mcp-auth:/root/.mcp-auth                       # Atlassian remote-MCP OAuth token (mcp-remote)
    depends_on:
      temporal:
        condition: service_started
      postgres:
        condition: service_healthy

# No named volumes — all persistent state is host bind-mounted under ~/.jarvis/data.
