# MCP servers — defined once, referenced by name from agent SPECs.
# Secrets come from environment variables (${VAR}) resolved at startup.
#
# Per-server tool gating (operator policy): add an optional `deny_tools` list to
# any server block to block specific tools. Tools are allow-by-default; only the
# named ones are blocked. Denied tools are hidden from the agent (exposure filter)
# AND rejected if somehow invoked (invocation gate). Use bare tool names.
# Note: renaming a denied tool upstream silently stops the denial matching.
#   deny_tools:
#     - some_noisy_tool
servers:
  # Local Python datetime MCP server (stdio). Ships in the image under
  # src/jarvis/mcp_servers/ and runs via the uv-managed interpreter. No external
  # process or auth — pure date/time/timezone helpers.
  datetime:
    type: stdio
    command: "uv"
    args: ["run", "python", "-m", "jarvis.mcp_servers.datetime_server"]
    timeout: 30

  # Shared by gmail (and later calendar) agents.
  # Self-hosted Gmail MCP server (stdio). It reads OAuth credentials + the cached
  # token from ~/.gmail-mcp/ (mounted into the container at /root/.gmail-mcp).
  # One-time auth (run on the host) produces that token — see README / docs.
  google:
    type: stdio
    command: "npx"
    args: ["-y", "@gongrzhe/server-gmail-autoauth-mcp"]
    deny_tools:
      - batch_delete_emails
      - delete_email
      - delete_filter
      - delete_label
      - download_attachment
      - send_email

  # Google Calendar MCP (stdio). Uses OAuth2 — credentials stored in ~/.google-calendar-mcp/.
  # One-time auth: GOOGLE_OAUTH_CREDENTIALS=~/.google-calendar-mcp/gcp-oauth.keys.json npx -y @cocal/google-calendar-mcp auth
  # See docs/google-calendar-mcp-setup.md for full setup instructions.
  google-calendar:
    type: stdio
    command: "npx"
    args: ["-y", "@cocal/google-calendar-mcp"]
    env:
      # $HOME works in both Docker (/root) and local (/Users/xxx)
      GOOGLE_OAUTH_CREDENTIALS: "${HOME}/.google-calendar-mcp/gcp-oauth.keys.json"
    deny_tools:
      - delete-event
      - manage-accounts

  # Slack MCP (korotovsky/slack-mcp-server) via npx. Browser-token auth: SLACK_MCP_XOXC_TOKEN
  # (workspace token from local storage) + SLACK_MCP_XOXD_TOKEN (the `d` session cookie).
  # See docs/slack-mcp-setup.md. Pre-installed in the image so npx resolves instantly.
  slack:
    type: stdio
    command: "npx"
    args: ["-y", "slack-mcp-server@latest", "--transport", "stdio"]
    # On a large workspace the server caches all channels/users at startup before it can
    # serve — slow on a cold cache. Allow up to 120s init; the cache dir is persisted via
    # a volume (docker-compose) so warm starts are fast.
    timeout: 120
    env:
      SLACK_MCP_XOXC_TOKEN: "${SLACK_MCP_XOXC_TOKEN}"
      SLACK_MCP_XOXD_TOKEN: "${SLACK_MCP_XOXD_TOKEN}"
      # Enable conversations_mark (mark messages/channels as read). Off by default
      # upstream to avoid accidental reads — required for "mark as read" permissions.
      SLACK_MCP_MARK_TOOL: "true"
      # Enable conversations_add_message (post messages). Off by default upstream for
      # safety; "true" allows all channels. Restrict to specific channel IDs if needed.
      SLACK_MCP_ADD_MESSAGE_TOOL: "true"
    deny_tools:
      - conversations_join
      - conversations_leave
      - usergroups_create
      - usergroups_me
      - usergroups_list
      - usergroups_update
      - usergroups_users_update

  # Atlassian (Jira + Confluence) remote MCP. The server is HTTP-only and gated behind
  # an interactive OAuth 2.1 browser flow, which cannot run inside the container. We bridge
  # it via `mcp-remote` (stdio <-> remote HTTP): it performs the OAuth dance and caches the
  # token under ~/.mcp-auth. Do the one-time login on the HOST with `jarvis-auth atlassian`;
  # docker-compose mounts ~/.mcp-auth into the container so it starts with a warm token.
  atlassian:
    type: stdio
    command: "npx"
    args: ["-y", "mcp-remote", "https://mcp.atlassian.com/v1/mcp"]
    # First run may download mcp-remote and refresh the OAuth token — allow a long init.
    timeout: 120
    deny_tools:
      - addWorklogToJiraIssue

  github:
    type: stdio
    command: "github-mcp-server"
    args: ["stdio"]
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_TOKEN}"
      GITHUB_TOOLSETS: "notifications,pull_requests,issues"
    timeout: 30
    deny_tools:
      - add_issue_comment
      - create_pull_request
      - issue_read
      - issue_write
      - list_issues
      - merge_pull_request
      - pull_request_review_write
      - search_issues
      - sub_issue_write
      - update_pull_request
      - update_pull_request_branch
